<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4DA3FF"/>
      <stop offset="100%" stop-color="#0055D4"/>
    </linearGradient>
    <!-- Tower bar gradient -->
    <linearGradient id="towerGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E8F0FE"/>
    </linearGradient>
  </defs>

  <!-- Squircle background (superellipse approximation) -->
  <rect x="0" y="0" width="300" height="300" rx="66" ry="66" fill="url(#bgGrad)"/>

  <!-- Tower of Babel — 5 stepped levels -->
  <!-- Each level: horizontal bar + text dots, narrowing toward top -->

  <!-- Level 5 (top, narrowest) -->
  <g transform="translate(150, 72)">
    <rect x="-32" y="0" width="64" height="22" rx="5" fill="url(#towerGrad)" opacity="0.95"/>
    <circle cx="-10" cy="11" r="2.5" fill="#007AFF" opacity="0.5"/>
    <circle cx="0" cy="11" r="2.5" fill="#007AFF" opacity="0.35"/>
    <circle cx="10" cy="11" r="2.5" fill="#007AFF" opacity="0.5"/>
  </g>

  <!-- Level 4 -->
  <g transform="translate(150, 100)">
    <rect x="-44" y="0" width="88" height="24" rx="6" fill="url(#towerGrad)" opacity="0.95"/>
    <circle cx="-16" cy="12" r="3" fill="#007AFF" opacity="0.55"/>
    <circle cx="0" cy="12" r="3" fill="#007AFF" opacity="0.4"/>
    <circle cx="16" cy="12" r="3" fill="#007AFF" opacity="0.55"/>
  </g>

  <!-- Level 3 -->
  <g transform="translate(150, 130)">
    <rect x="-58" y="0" width="116" height="26" rx="7" fill="url(#towerGrad)" opacity="0.95"/>
    <circle cx="-24" cy="13" r="3.5" fill="#007AFF" opacity="0.6"/>
    <circle cx="-8" cy="13" r="3.5" fill="#007AFF" opacity="0.45"/>
    <circle cx="8" cy="13" r="3.5" fill="#007AFF" opacity="0.45"/>
    <circle cx="24" cy="13" r="3.5" fill="#007AFF" opacity="0.6"/>
  </g>

  <!-- Level 2 -->
  <g transform="translate(150, 162)">
    <rect x="-74" y="0" width="148" height="28" rx="8" fill="url(#towerGrad)" opacity="0.95"/>
    <circle cx="-34" cy="14" r="4" fill="#007AFF" opacity="0.65"/>
    <circle cx="-16" cy="14" r="4" fill="#007AFF" opacity="0.5"/>
    <circle cx="0" cy="14" r="4" fill="#007AFF" opacity="0.5"/>
    <circle cx="16" cy="14" r="4" fill="#007AFF" opacity="0.5"/>
    <circle cx="34" cy="14" r="4" fill="#007AFF" opacity="0.65"/>
  </g>

  <!-- Level 1 (bottom, widest) -->
  <g transform="translate(150, 196)">
    <rect x="-92" y="0" width="184" height="30" rx="9" fill="url(#towerGrad)" opacity="0.95"/>
    <circle cx="-46" cy="15" r="4.5" fill="#007AFF" opacity="0.7"/>
    <circle cx="-24" cy="15" r="4.5" fill="#007AFF" opacity="0.55"/>
    <circle cx="0" cy="15" r="4.5" fill="#007AFF" opacity="0.55"/>
    <circle cx="24" cy="15" r="4.5" fill="#007AFF" opacity="0.55"/>
    <circle cx="46" cy="15" r="4.5" fill="#007AFF" opacity="0.7"/>
  </g>

  <!-- Subtle glow at tower base -->
  <ellipse cx="150" cy="232" rx="100" ry="8" fill="#FFFFFF" opacity="0.15"/>
</svg>
